default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: validate-notebooks
        name: Проверка структуры ноутбуков
        entry: python tools/validate_notebooks.py
        language: python
        additional_dependencies: [nbformat==5.10.4]
        types: [jupyter]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        args:
          - --keep-id
          - --keep-metadata-keys=cell.metadata.collapsed
          - --extra-keys=metadata.language_info.version
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.ipynb$'
      - id: end-of-file-fixer
        exclude: '\.ipynb$'
      - id: check-added-large-files
        args: [--maxkb=4096]
        exclude: '^Lectures/.*\.pdf$'
